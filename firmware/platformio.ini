; PlatformIO project for a3-motion firmware

[platformio]
; `pio run` builds the device. The native env is for `pio test -e native` only.
default_envs = esp32-s3-devkitc-1-n16r8

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
board_dir = boards
framework = arduino

monitor_speed = 115200
monitor_port = /dev/ttyACM1
upload_port = /dev/ttyACM1

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  adafruit/Adafruit NeoPixel
  thomasfredericks/Bounce2

; Host-side unit tests for the parts of the firmware that need no Arduino:
; `pio test -e native`. Builds nothing from src/ -- that is device code.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
